name: El Yunque official access monitor

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Stage transitions without sending repository_dispatch"
        required: false
        default: "false"

permissions:
  contents: write
  # scripts/push_to_main.sh records docs-sync on the data commit before pushing it.
  statuses: write

concurrency:
  group: el-yunque-access-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install monitor dependencies
        run: |
          command -v uv >/dev/null 2>&1 || python -m pip install -q uv
          uv pip install --system -e ".[dev]"
      - name: Smoke-test monitor from clean checkout
        run: python tools/el_yunque_access_monitor.py --help
      - name: Poll official USDA Forest Service alerts
        env:
          FEDERATION_DISPATCH_TOKEN: ${{ secrets.FEDERATION_DISPATCH_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "${DRY_RUN:-false}" = "true" ]; then
            python tools/el_yunque_access_monitor.py --dry-run
          else
            python tools/el_yunque_access_monitor.py
          fi
      - name: Persist state, transitions, health, and outbox
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "centinelas-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/monitoring/el_yunque .centinelas/outbound/el_yunque_access 2>/dev/null || true
          git diff --cached --quiet || git commit -m "data: refresh El Yunque access status [skip ci]"
          scripts/push_to_main.sh el-yunque-access-monitor
      - name: Upload monitor receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: el-yunque-access-monitor
          path: |
            data/monitoring/el_yunque
            .centinelas/outbound/el_yunque_access
          if-no-files-found: ignore
