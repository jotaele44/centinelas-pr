name: Validate legacy hosted handoff acknowledgment

# Compatibility observer for acknowledgments emitted by pre-migration consumers.
# It never creates a canonical local receipt and never commits callback data.

on:
  repository_dispatch:
    types: [centinelas-handoff-ack]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate noncanonical hosted acknowledgment observation
        env:
          CENTINELAS_ACK: ${{ toJSON(github.event.client_payload) }}
          CENTINELAS_ACK_OUTPUT_DIR: reports/hosted-handoff-ack-observations
        run: python3 scripts/record_handoff_ack.py
      - name: Upload audit-only observation
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: centinelas-hosted-handoff-ack-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/hosted-handoff-ack-observations
          if-no-files-found: error
