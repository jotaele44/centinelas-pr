name: Federal records limited metadata pilot

on:
  pull_request:
    branches: [main]
    paths:
      - "approvals/federal-records-limited-metadata-pilot-20260728.json"

permissions:
  contents: read

concurrency:
  group: federal-records-limited-pilot-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  limited-pilot:
    if: github.event.pull_request.draft == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install parser runtime dependency
        run: python -m pip install "pydantic>=2.6,<3"
      - name: Verify exact approved safety state
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("config/federal_records_source_enablement.json").read_text())
          assert manifest["pilot_enabled"] is True
          assert manifest["mode"] == "metadata_only"
          assert manifest["linked_binary_fetch"] is False
          assert manifest["baseline_mutation_allowed"] is False
          assert manifest["emergency_kill_switch"]["engaged"] is False
          enabled = [k for k, v in manifest["sources"].items() if v.get("enabled") is True]
          assert enabled == ["nara_ndc", "dia_reading_room", "air_force_blue_book"]
          for source_id in enabled:
              source = manifest["sources"][source_id]
              assert source["max_pages_per_run"] == 1
              assert source["max_records_per_run"] == 100
              assert source["daily_request_budget"] == 4
              assert source["robots_allowed"] is True
              assert source["policy_review_status"] == "approved"
              assert source["linked_binary_fetch"] is False
          PY
      - name: Run approved metadata-only pilot
        env:
          PYTHONPATH: src
        run: |
          python tools/run_approved_limited_metadata_pilot.py \
            --manifest config/federal_records_source_enablement.json \
            --approval approvals/federal-records-limited-metadata-pilot-20260728.json \
            --out limited-pilot-output \
            --delay 2 \
            --timeout 30
      - name: Assert zero document acquisition and immutable baseline
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cert = json.loads(Path("limited-pilot-output/two-run-reproducibility-certificate.json").read_text())
          assert cert["all_sources_deterministic"] is True
          assert cert["documents_downloaded"] == 0
          assert cert["baseline_mutated"] is False
          assert cert["linked_binary_fetch"] is False
          assert cert["automatic_attribution"] is False
          PY
      - name: Upload private pilot evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: federal-records-limited-pilot-${{ github.sha }}
          path: limited-pilot-output/
          if-no-files-found: error
          retention-days: 14
