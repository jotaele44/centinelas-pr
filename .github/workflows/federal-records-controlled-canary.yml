name: Federal records controlled canary

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/run_federal_records_canaries.py"
      - "src/centinelas/releases/parsers.py"
      - ".github/workflows/federal-records-controlled-canary.yml"

permissions:
  contents: read

concurrency:
  group: federal-records-canary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  controlled-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install parser runtime dependency
        run: python -m pip install "pydantic>=2.6,<3"
      - name: Run metadata-only source canaries
        env:
          PYTHONPATH: src
        run: |
          python tools/run_federal_records_canaries.py \
            --out canary-output \
            --delay 2 \
            --timeout 30
      - name: Assert no document binaries were acquired
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          certificate = json.loads(
              Path("canary-output/two-run-reproducibility-certificate.json").read_text()
          )
          assert certificate["documents_downloaded"] == 0
          assert certificate["baseline_mutated"] is False
          PY
      - name: Upload private canary evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: federal-records-controlled-canary-${{ github.sha }}
          path: canary-output/
          if-no-files-found: error
          retention-days: 14
