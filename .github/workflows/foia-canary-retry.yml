name: FOIA canary failed-target retry
on:
  workflow_dispatch:
    inputs:
      canary_branch:
        required: true
        default: canary/centinelas-foia-v0-5
permissions:
  contents: write
jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce canary branch
        run: |
          case "${{ inputs.canary_branch }}" in canary/*) ;; *) exit 1;; esac
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.canary_branch }}
      - name: Retry only unacknowledged or failed targets
        env:
          TOKEN: ${{ secrets.FEDERATION_DISPATCH_TOKEN }}
          CANARY_BRANCH: ${{ inputs.canary_branch }}
        run: |
          test -n "$TOKEN"
          python - <<'PY'
          import hashlib,json,os,pathlib,urllib.error,urllib.request
          dispatch_path=pathlib.Path('artifacts/foia_canary_dispatch/dispatch-ledger.json')
          ledger=json.loads(dispatch_path.read_text())
          ack_root=pathlib.Path('artifacts/foia_canary_acks')
          retry_rows=[]
          for entry in ledger['entries']:
              ack_key=f"{entry['idempotency_key']}:{entry['destination']}"
              ack_path=ack_root/f"{hashlib.sha256(ack_key.encode()).hexdigest()}.json"
              if ack_path.exists() and entry['status'] not in {'failed','injected_failure_pending_retry'}:
                  continue
              payload=dict(entry['payload']); payload['canary_branch']=os.environ['CANARY_BRANCH']
              body=json.dumps({'event_type':'foia-canary','client_payload':payload}).encode()
              request=urllib.request.Request(f"https://api.github.com/repos/jotaele44/{entry['repository']}/dispatches",data=body,method='POST',headers={'Authorization':f"Bearer {os.environ['TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              status='pending_ack'; error=None; http_status=None
              try:
                  with urllib.request.urlopen(request,timeout=20) as response: http_status=response.status
              except (urllib.error.URLError,TimeoutError) as exc:
                  status='failed'; error=str(exc)
              entry['status']=status; entry['error']=error; entry['http_status']=http_status; entry['canary_branch']=os.environ['CANARY_BRANCH']; entry['attempts']=entry.get('attempts',1)+1; entry['payload']=payload
              retry_rows.append({'destination':entry['destination'],'repository':entry['repository'],'status':status,'attempts':entry['attempts']})
          dispatch_path.write_text(json.dumps(ledger,indent=2,sort_keys=True)+'\n')
          pathlib.Path('artifacts/foia_canary_dispatch/retry-ledger.json').write_text(json.dumps({'retried':retry_rows},indent=2,sort_keys=True)+'\n')
          PY
      - name: Commit retry ledger
        run: |
          git config user.name foia-canary-bot
          git config user.email actions@users.noreply.github.com
          git add artifacts/foia_canary_dispatch
          git diff --cached --quiet || git commit -m "test: retry failed FOIA canary targets [skip ci]"
          git push origin HEAD:${{ inputs.canary_branch }}
