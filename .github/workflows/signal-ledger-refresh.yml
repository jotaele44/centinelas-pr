name: Signal ledger refresh

# Keeps data/signals/live_signals.jsonl inside the production export's
# freshness window (scripts/federation_export.py DEFAULT_MAX_AGE_HOURS = 168h).
# Without a scheduled refresh the ledger ages out and export_canonical fails
# closed while federation.json still declares ready_for_hub_live_execution.
# The ledger is committed only after the production export accepts it.

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # scripts/push_to_main.sh records docs-sync on the data commit before pushing it.
  statuses: write

concurrency:
  group: signal-ledger-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Centinelas
        run: |
          command -v uv >/dev/null 2>&1 || python -m pip install -q uv
          uv pip install --system -e ".[dev]" -r server/backend/requirements.txt
      - name: Poll live feeds into the signal ledger
        env:
          # Optional: without it the classifier falls back to keyword rules.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # All three intake layers (RSS, Federal Register, listing scrapers) with a
        # per-source cap, so the DRNA/OGPe/JP/EPA permit sources are not crowded
        # out by high-volume news feeds polled earlier.
        run: python scripts/build_signal_ledger.py --per-source 10 --limit 300
      - name: Gate on the production export
        run: >-
          python scripts/federation_export.py
          --ledger data/signals/live_signals.jsonl
          --mode production
          --out "$RUNNER_TEMP/centinelas-export"
      - name: Persist refreshed ledger
        id: persist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "centinelas-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/signals/live_signals.jsonl
          if git diff --cached --quiet; then
            echo "No signal ledger changes to persist."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: refresh live signal ledger [skip ci]"
            scripts/push_to_main.sh signal-ledger-refresh
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
      # thehub-pr's federation-ingest.yml listens for centinelas-export; until now
      # nothing sent it, so a refreshed ledger waited for the Hub's next run.
      - name: Notify Hub
        if: ${{ steps.persist.outputs.pushed == 'true' }}
        env:
          TOKEN: ${{ secrets.FEDERATION_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::No FEDERATION_DISPATCH_TOKEN; the Hub picks the ledger up on its daily run."
            exit 0
          fi
          body=$(jq -nc --arg sha "$(git rev-parse HEAD)" \
            '{event_type:"centinelas-export",client_payload:{producer:"centinelas-pr",ledger_commit:$sha}}')
          curl -sSf -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/jotaele44/thehub-pr/dispatches \
            -d "$body"
