name: validate space observations

on:
  push:
    branches:
      - codex/centinelas-satellite-observations-v0-3
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: |
          if [ ! -d ../thehub-pr ]; then
            git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr
          fi
          command -v uv >/dev/null 2>&1 || python -m pip install -q uv
          uv pip install --system -e ".[dev]"
      - name: Ruff
        run: ruff check .

  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install validation dependencies
        run: |
          if [ ! -d ../thehub-pr ]; then
            git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr
          fi
          command -v uv >/dev/null 2>&1 || python -m pip install -q uv
          uv pip install --system -e ".[dev]" httpx -r server/backend/requirements.txt
      - name: Federation manifest gate
        run: python -c 'import json; m=json.load(open("federation.json")); assert m["program_id"]=="centinelas-pr"; assert m["hub_parent"]=="thehub-pr"'
      - name: Validate PR spatial grid
        run: python3 scripts/validate_pr_grid.py --require-sha
      - name: Export canonical package
        run: python3 scripts/federation_export.py --mode test --out /tmp/centinelas_federation
      - name: Verify space-observation schema freeze
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          root = Path("schemas/space_observations")
          expected = {}
          for line in (root / "FROZEN.sha256").read_text().splitlines():
              digest, name = line.split(None, 1)
              expected[name.strip()] = digest
          actual = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in root.glob("*.json")
          }
          assert actual == expected, f"schema freeze mismatch: expected={expected} actual={actual}"
          PY
      - name: Full pytest
        run: pytest -q
