name: FOIA canary acknowledgment ledger
on:
  repository_dispatch:
    types: [foia-canary-ack]
permissions:
  contents: write
jobs:
  acknowledge:
    if: github.event.client_payload.canary == true
    runs-on: ubuntu-latest
    steps:
      - name: Validate acknowledgment contract
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          python - <<'PY'
          import json, os
          p=json.loads(os.environ['PAYLOAD'])
          assert p['canary'] is True
          assert p['canary_branch'].startswith('canary/')
          assert p['no_production_promotion'] is True
          assert p['status']=='acknowledged'
          assert p['idempotency_key'] and p['destination'] and p['record_id']
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.canary_branch }}
      - name: Persist idempotent acknowledgment
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          p=json.loads(os.environ['PAYLOAD'])
          key=f"{p['idempotency_key']}:{p['destination']}"
          root=pathlib.Path('artifacts/foia_canary_acks'); root.mkdir(parents=True,exist_ok=True)
          out=root/f"{hashlib.sha256(key.encode()).hexdigest()}.json"
          if not out.exists():
              out.write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          else:
              prior=json.loads(out.read_text())
              assert prior['record_id']==p['record_id']
          PY
      - name: Commit acknowledgment to canary branch
        run: |
          git config user.name foia-canary-bot
          git config user.email actions@users.noreply.github.com
          git add artifacts/foia_canary_acks
          git diff --cached --quiet || git commit -m "test: record FOIA canary acknowledgment [skip ci]"
          git push origin HEAD:${{ github.event.client_payload.canary_branch }}
