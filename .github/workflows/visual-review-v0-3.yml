name: visual-review-v0-3

on:
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - "PRII-CENTINELAS.app/**"
      - ".github/workflows/visual-review-v0-3.yml"

permissions:
  contents: read

jobs:
  macos-identity:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Centinelas bundle identity and render icon
        shell: bash
        run: |
          set -euo pipefail
          plist="PRII-CENTINELAS.app/Contents/Info.plist"
          display=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$plist")
          name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$plist")
          icon_key=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$plist")
          app_title=$(python3 - <<'PY'
          from desktop.config import APP_TITLE
          print(APP_TITLE)
          PY
          )
          test "$display" = "Centinelas"
          test "$name" = "Centinelas"
          test "$app_title" = "Centinelas"
          test "$icon_key" = "AppIcon"
          icon="PRII-CENTINELAS.app/Contents/Resources/AppIcon.icns"
          test -s "$icon"
          mkdir -p macos-identity-artifacts
          sips -s format png "$icon" --out macos-identity-artifacts/centinelas-app-icon.png >/dev/null
          printf '{"result":"PASS","CFBundleDisplayName":"%s","CFBundleName":"%s","APP_TITLE":"%s","CFBundleIconFile":"%s","iconBytes":%s}\n' "$display" "$name" "$app_title" "$icon_key" "$(stat -f%z "$icon")" > macos-identity-artifacts/centinelas-macos-ledger.json
      - uses: actions/upload-artifact@v4
        with:
          name: centinelas-macos-identity
          path: macos-identity-artifacts
          if-no-files-found: error
