name: FOIA canary dispatch
on:
  workflow_dispatch:
    inputs:
      canary_branch:
        required: true
        default: canary/centinelas-foia-v0-5
      inject_failure_target:
        required: false
        default: ""
permissions:
  contents: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Prepare isolated canary branch
        env:
          CANARY_BRANCH: ${{ inputs.canary_branch }}
        run: |
          case "$CANARY_BRANCH" in
            canary/*) ;;
            *) echo "unsafe canary_branch" >&2; exit 1;;
          esac
          if ! printf '%s' "$CANARY_BRANCH" | grep -Eq '^canary/[A-Za-z0-9._-]+$'; then
            echo "unsafe canary_branch" >&2
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "$CANARY_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$CANARY_BRANCH"
            git switch -C "$CANARY_BRANCH" "origin/$CANARY_BRANCH"
          else
            git switch -c "$CANARY_BRANCH"
            git push -u origin "$CANARY_BRANCH"
          fi
      - name: Build, dispatch, and record synthetic envelopes
        env:
          TOKEN: ${{ secrets.FEDERATION_DISPATCH_TOKEN }}
          CANARY_BRANCH: ${{ inputs.canary_branch }}
          INJECT_FAILURE_TARGET: ${{ inputs.inject_failure_target }}
        run: |
          test -n "$TOKEN"
          python - <<'PY'
          import hashlib, json, os, pathlib, urllib.error, urllib.request
          targets=[('thehub-pr','thehub_evidence'),('thehub-pr','thehub_intelligence'),('ovnis-pr','ovnis'),('skywatcher-pr','skywatcher'),('aguayluz-pr','aguayluz'),('moneysweep-pr','moneysweep'),('spiderweb-pr','spiderweb')]
          finding={'finding_id':'synthetic-foia-canary-v0-5','release_id':'synthetic-release','document_id':'synthetic-document','finding_type':'mixed_content','title':'Synthetic FOIA canary','summary':'Synthetic aircraft contract utility and anomalous report for Puerto Rico','citations':[{'document_id':'synthetic-document','page':1,'excerpt':'Synthetic non-private canary evidence.'}],'keywords':['aircraft','contract','utility','unidentified','Puerto Rico'],'evidence_tier':'T1','extraction_confidence':0.95,'sensitive':False,'entity_collision':False}
          ledger=[]
          for repo,destination in targets:
              decision={'decision_id':f'decision-{destination}','finding_id':finding['finding_id'],'destination':destination,'disposition':'export','score':0.95,'reason_codes':['SYNTHETIC_CANARY'],'reversible':True}
              envelope={'schema_name':'prii.foia.finding','schema_version':'0.2.0','producer':'centinelas-pr','event_id':f'foia-canary-{destination}','idempotency_key':'','destination':destination,'finding':finding,'decision':decision}
              key=hashlib.sha256(f"{finding['finding_id']}:{destination}:{finding['document_id']}".encode()).hexdigest(); envelope['idempotency_key']=key
              injected = repo == os.environ.get('INJECT_FAILURE_TARGET')
              branch='canary/injected-failure-v0-5' if injected else os.environ['CANARY_BRANCH']
              payload={'canary':True,'canary_branch':branch,'canary_receipt_namespace':'artifacts/foia_canary_receipts','no_production_promotion':True,'target_repo':repo,'destination':destination,'idempotency_key':key,'envelope':envelope}
              body=json.dumps({'event_type':'foia-canary','client_payload':payload}).encode()
              request=urllib.request.Request(f'https://api.github.com/repos/jotaele44/{repo}/dispatches',data=body,method='POST',headers={'Authorization':f"Bearer {os.environ['TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              status='pending_ack'; error=None
              try:
                  with urllib.request.urlopen(request,timeout=20) as response:
                      http_status=response.status
              except (urllib.error.URLError, TimeoutError) as exc:
                  status='failed'; http_status=None; error=str(exc)
              if injected and status == 'pending_ack':
                  status='injected_failure_pending_retry'
              ledger.append({'repository':repo,'destination':destination,'idempotency_key':key,'canary_branch':branch,'status':status,'http_status':http_status,'error':error,'attempts':1,'payload':payload})
          root=pathlib.Path('artifacts/foia_canary_dispatch'); root.mkdir(parents=True,exist_ok=True)
          (root/'dispatch-ledger.json').write_text(json.dumps({'canary_branch':os.environ['CANARY_BRANCH'],'entries':ledger},indent=2,sort_keys=True)+'\n')
          PY
      - name: Commit dispatch ledger to canary branch
        env:
          CANARY_BRANCH: ${{ inputs.canary_branch }}
        run: |
          git config user.name foia-canary-bot
          git config user.email actions@users.noreply.github.com
          git add artifacts/foia_canary_dispatch
          git diff --cached --quiet || git commit -m "test: record FOIA canary dispatch [skip ci]"
          git push origin "HEAD:$CANARY_BRANCH"
