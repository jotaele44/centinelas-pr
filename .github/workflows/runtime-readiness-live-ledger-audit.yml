name: Runtime readiness live ledger audit

on:
  push:
    branches:
      - audit/runtime-readiness-live-ledger-v0-1

permissions:
  contents: read

jobs:
  live-ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 03de71ef67bb53fb0607d1c04c2943590a98891d
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install exact producer runtime
        run: |
          python -m pip install uv
          uv pip install --system -e .[dev]
      - name: Poll configured public feeds into temporary ledger
        run: timeout 180s python scripts/build_signal_ledger.py --out "$RUNNER_TEMP/live_signals.jsonl"
      - name: Require real nonzero fresh observations
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'live_signals.jsonl'
          rows = [json.loads(line) for line in p.read_text().splitlines() if line.strip()]
          assert rows, 'live ledger is empty'
          assert all(not row.get('is_synthetic') for row in rows), 'synthetic row present'
          captures=[]
          for row in rows:
              value=row.get('captured_at')
              assert value, 'missing captured_at'
              captures.append(datetime.fromisoformat(value.replace('Z','+00:00')).astimezone(timezone.utc))
          newest=max(captures)
          age=(datetime.now(timezone.utc)-newest).total_seconds()/3600
          assert age <= 168, f'newest capture stale: {age:.2f}h'
          print(f'PASS rows={len(rows)} newest={newest.isoformat()} age_hours={age:.3f}')
          PY
      - name: Run production exporter against temporary live ledger
        run: >-
          python scripts/federation_export.py
          --ledger "$RUNNER_TEMP/live_signals.jsonl"
          --out "$RUNNER_TEMP/centinelas-package"
          --mode production
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jotaele44/thehub-pr
          ref: 54f00e551c8660d83a657b54bf2a136dc4ebed42
          path: _thehub_audit
      - name: Install exact Hub validator
        run: python -m pip install -e _thehub_audit
      - name: Validate production package through TheHub
        run: hub validate-package "$RUNNER_TEMP/centinelas-package"
