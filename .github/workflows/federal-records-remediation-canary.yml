name: Federal records remediation canary

on:
  pull_request:
    branches: [main]
    paths:
      - "config/federal_records_source_enablement.json"
      - "data/releases/manual_policy_review_ledger_phase3b.json"
      - "data/releases/remediation_ledger_phase3b.json"
      - "src/centinelas/releases/pilot.py"
      - "src/centinelas/releases/source_endpoints.py"
      - "tools/run_federal_records_remediation_canaries.py"
      - "tools/run_limited_metadata_pilot.py"
      - ".github/workflows/federal-records-remediation-canary.yml"

permissions:
  contents: read

concurrency:
  group: federal-records-remediation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  remediation-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install parser runtime dependency
        run: python -m pip install "pydantic>=2.6,<3"
      - name: Generate fail-closed pilot readiness certificate
        env:
          PYTHONPATH: src
        run: python tools/run_limited_metadata_pilot.py --out remediation-output/preflight-pilot-readiness.json
      - name: Run corrected metadata-only remediation canaries
        env:
          PYTHONPATH: src
        run: |
          python tools/run_federal_records_remediation_canaries.py \
            --out remediation-output \
            --delay 2 \
            --timeout 30
      - name: Assert preserved invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cert = json.loads(Path("remediation-output/two-run-remediation-certificate.json").read_text())
          ready = json.loads(Path("remediation-output/pilot-readiness-certificate.json").read_text())
          assert cert["documents_downloaded"] == 0
          assert cert["baseline_mutated"] is False
          assert ready["pilot_ready"] is False
          assert ready["live_collection_executed"] is False
          PY
      - name: Upload private remediation evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: federal-records-remediation-${{ github.sha }}
          path: remediation-output/
          if-no-files-found: error
          retention-days: 14
