name: Dispatch signals to MoneySweep + project leads to SpiderWeb

# Existing event-driven finance path is preserved: all routed MoneySweep signals
# are emitted exactly as before.  Minimal extension: only payloads carrying the
# explicit project_lead envelope are additionally emitted to SpiderWeb.  Generic
# non-project SpiderWeb discovery remains untouched.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'YES' to actually POST repository_dispatch (else dry-run)"
        required: true
        default: "no"
      limit:
        description: "Max items to process (0 = no cap)"
        required: false
        default: "25"

permissions:
  contents: read

env:
  CENTINELAS_OUTBOUND_DIR: .centinelas/outbound

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          if [ ! -d ../thehub-pr ]; then git clone --depth 1 --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" https://github.com/jotaele44/thehub-pr.git ../thehub-pr || git clone --depth 1 https://github.com/jotaele44/thehub-pr.git ../thehub-pr; fi
          command -v uv >/dev/null 2>&1 || python -m pip install -q uv
          uv pip install --system -e ".[dev,export]"

      - name: Run pipeline (ingest -> classify -> route, stage to outbound)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          centinelas run --limit "${{ github.event.inputs.limit }}"
          echo "Staged payloads:"
          find "$CENTINELAS_OUTBOUND_DIR" -name '*.json' -print 2>/dev/null | sort || true

      - name: Emit existing MoneySweep path
        env:
          FEDERATION_DISPATCH_TOKEN: ${{ secrets.FEDERATION_DISPATCH_TOKEN }}
        run: |
          if [ "$(printf '%s' "${{ github.event.inputs.confirm }}" | tr '[:upper:]' '[:lower:]')" = "yes" ]; then
            python3 scripts/emit_dispatches.py --only-repo moneysweep-pr
          else
            echo "confirm != YES — dry-run (no POST)."
            python3 scripts/emit_dispatches.py --only-repo moneysweep-pr --dry-run
          fi

      - name: Emit project-lead-only SpiderWeb fanout
        env:
          FEDERATION_DISPATCH_TOKEN: ${{ secrets.FEDERATION_DISPATCH_TOKEN }}
        run: |
          if [ "$(printf '%s' "${{ github.event.inputs.confirm }}" | tr '[:upper:]' '[:lower:]')" = "yes" ]; then
            python3 scripts/emit_project_lead_dispatches.py
          else
            python3 scripts/emit_project_lead_dispatches.py --dry-run
          fi

      - name: Upload staged payloads artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: centinelas-outbound
          path: .centinelas/outbound
          if-no-files-found: ignore
