name: Stage signals for MoneySweep

# Manual producer run. Centinelas first commits canonical local envelopes under
# .centinelas/exchange. GitHub repository_dispatch is an optional exact-byte
# mirror and is never the authoritative completion state.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type YES to attempt the optional GitHub mirror after local staging"
        required: true
        default: "no"
      classifier_backend:
        description: "Classifier adapter; local is credential-free and authoritative"
        required: true
        default: "local"
        type: choice
        options:
          - local
          - anthropic
      limit:
        description: "Max items to process (0 = no cap)"
        required: false
        default: "25"

permissions:
  contents: read

env:
  CENTINELAS_EXCHANGE_ROOT: .centinelas/exchange

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip

      - name: Install selected profile
        env:
          CLASSIFIER_BACKEND: ${{ github.event.inputs.classifier_backend }}
        shell: bash
        run: |
          set -euo pipefail
          command -v uv >/dev/null 2>&1 || python -m pip install -q uv
          extras="dev,export"
          if [[ "$CLASSIFIER_BACKEND" == "anthropic" ]]; then
            extras="dev,export,hosted-classifier"
          fi
          uv pip install --system -e ".[${extras}]"

      - name: Require credential only for explicit hosted classification
        env:
          CLASSIFIER_BACKEND: ${{ github.event.inputs.classifier_backend }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CLASSIFIER_BACKEND" == "anthropic" && -z "$ANTHROPIC_API_KEY" ]]; then
            echo "::error::classifier_backend=anthropic requires ANTHROPIC_API_KEY"
            exit 1
          fi

      - name: Run pipeline and commit local outbox authority
        env:
          CENTINELAS_CLASSIFIER_BACKEND: ${{ github.event.inputs.classifier_backend }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LIMIT: ${{ github.event.inputs.limit }}
        shell: bash
        run: |
          set -euo pipefail
          centinelas run --limit "$LIMIT"
          echo "Canonical local envelopes:"
          find "$CENTINELAS_EXCHANGE_ROOT/outbox" -type f -name '*.json' -print 2>/dev/null | sort || true

      - name: Validate or attempt optional MoneySweep mirror
        env:
          FEDERATION_DISPATCH_TOKEN: ${{ secrets.FEDERATION_DISPATCH_TOKEN }}
          CONFIRM: ${{ github.event.inputs.confirm }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(printf '%s' "$CONFIRM" | tr '[:upper:]' '[:lower:]')" == "yes" ]]; then
            python3 scripts/emit_dispatches.py \
              --exchange-root "$CENTINELAS_EXCHANGE_ROOT" \
              --only-repo moneysweep-pr
          else
            echo "confirm != YES - validating mirror bytes without POST."
            python3 scripts/emit_dispatches.py \
              --exchange-root "$CENTINELAS_EXCHANGE_ROOT" \
              --only-repo moneysweep-pr \
              --dry-run
          fi

      - name: Upload local exchange snapshot
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: centinelas-local-exchange-moneysweep
          path: .centinelas/exchange
          if-no-files-found: ignore
