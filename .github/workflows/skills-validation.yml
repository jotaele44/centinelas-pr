name: skills-validation

# Focused, offline gate for the PRII skill packet. Runs the shared validator
# and the skill_contract tests with a minimal dependency set (no git-pinned
# federation packages), so the packet stays green independently of the full
# validate.yml matrix.

on:
  push:
    branches: [main]
    paths:
      - skill-registry.yaml
      - activation-matrix.yaml
      - dependency-graph.yaml
      - skills/**
      - scripts/validate_skills.py
      - schemas/prii_skill_contract.schema.json
      - tests/skill_contract/**
      - .github/workflows/skills-validation.yml
  pull_request:
    branches: [main]
    paths:
      - skill-registry.yaml
      - activation-matrix.yaml
      - dependency-graph.yaml
      - skills/**
      - scripts/validate_skills.py
      - schemas/prii_skill_contract.schema.json
      - tests/skill_contract/**
      - .github/workflows/skills-validation.yml
  workflow_dispatch:

# Least privilege: this workflow only reads the repo (and uploads artifacts,
# which uses the runtime token, not GITHUB_TOKEN). Widen deliberately if a
# step ever needs to write back.
permissions:
  contents: read

# Supersede older runs of this workflow on the same ref: a newer push
# makes the in-flight result irrelevant, so cancel it and free the runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skills-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install minimal deps
        run: python -m pip install pyyaml pytest jsonschema
      - name: Validate skill packet
        run: python scripts/validate_skills.py
      - name: Skill contract tests
        run: python -m pytest tests/skill_contract -q
