  # ── Contracts / Procurement (PR contractor & agency press) ─
  # PR contractor / procurement award announcements. These are the
  # pre-officialization finance signals that anchor to moneysweep-pr: a
  # contractor announcing an awarded contract (dollar amount + agency) before it
  # shows up in the official federal/territorial spending datasets. Classified
  # FINANCIAL via the procurement/award vocabulary in classify/rules.py, then
  # enriched (estimated_value / agencies / signal_stage) by classify/enrich.py.
  # Add more contractor/agency WordPress `/feed/` endpoints here as they are
  # verified to expose valid RSS.
  - name: "Del Valle Group"
    url: "https://delvallegroup.net/feed/"
    tier: "T2"

