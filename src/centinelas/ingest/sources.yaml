# ── Federal Register (JSON API, not RSS) ────────────────
# Federal coastal/environmental permit actions touching Puerto Rico, pulled from
# the Federal Register JSON API (server-side filtered by term + agency, so the
# result is content-rich and PR-scoped — unlike the USACE district RSS, whose
# items are opaque permit-ID stubs with no body/location). Consumed by
# ingest/federal_register.py (poll_federal_register). Agencies are Federal
# Register slugs. See data/reference/source_registry.csv for the scrape-only
# federal sources (USACE Jacksonville notices, EPA Region 2 NPDES).
federal_register:
  enabled: true
  term: "Puerto Rico"
  order: "newest"
  per_page: 50
  tier: "T1"
  agencies:
    - "engineers-corps"
    - "environmental-protection-agency"

# ── HTML scrape sources (no feed available) ─────────────
# The central permitting bodies — OGPe (permisos.pr.gov) and the Junta de
# Planificación (jp.pr.gov) — plus EPA Region 2's PR NPDES listing publish no
# RSS. All of them are server-rendered (content is in the raw HTML; no JS
# execution needed), so ingest/web.py parses them with httpx + BeautifulSoup.
# Consumed by web.poll_scrape_sources(). Each source names a `parser`:
#   webflow_cms — Webflow CMS collection lists (.w-dyn-item), optionally
#                 restricted to named tab panes via `tabs`
#   html_table  — a header-row + data-row HTML table
#   rss_detail  — an RSS index whose items are stubs, so each linked notice
#                 page is fetched for its body (crawl depth 2)
#   asg_cards   — ASG's hand-rolled Bootstrap card listings, whose per-field CSS
#                 selectors come from config (item/title/date/body/link);
#                 paginates via `max_pages` and, when the cards carry no date,
#                 resolves one from each entry's page via `detail_date_label`
scrape:
  enabled: true
  sources:
    - name: "OGPe — Fuentes de Información"
      url: "https://permisos.pr.gov/fuentes-de-informacion"
      parser: webflow_cms
      tier: "T1"
      # Permit-signal panes only. The page also carries Manuales, Guía de
      # Usuario SBP, Videos Informativos, Formularios, Mapas de Inundabilidad,
      # Códigos and Informes — how-to material, not permit events. Ingesting
      # those would put user manuals and tutorial videos into the signal
      # pipeline permanently, so they are deliberately excluded here.
      tabs:
        - "Vistas Públicas"
        - "Próximas Vistas"
        - "Vistas Pasadas"
        - "Documentos Ambientales"
        - "Ordenes Administrativas"
        - "Leyes y Reglamentos"
        - "RFPs"
        - "Ordenanzas Municipales"
        - "Cartas Circulares"

    # `section` labels what each entry *is* for pages whose whole listing is one
    # record type. Entries here are often titled with only a case number or a
    # short code ("VP - Poblado Castañer"), so without it the item carries no
    # word the classifier can act on.
    - name: "JP — Vistas Públicas"
      url: "https://jp.pr.gov/vistas-publicas"
      parser: webflow_cms
      tier: "T1"
      section: "Vista pública de la Junta de Planificación"

    - name: "JP — Resoluciones Especiales"
      url: "https://jp.pr.gov/resoluciones-especiales"
      parser: webflow_cms
      tier: "T2"
      section: "Resolución especial de la Junta de Planificación"

    - name: "JP — Noticias y Comunicados"
      url: "https://jp.pr.gov/noticias-comunicados"
      parser: webflow_cms
      tier: "T2"
      section: "Comunicado de la Junta de Planificación"

    # ASG is the central procurement authority (Ley 73-2019): its bid index is
    # the pre-award counterpart to the contracts MoneySweep catalogs after the
    # fact. https://asg.pr.gov/transparencia is deliberately NOT listed — it is
    # a nine-tile navigation page with no records of its own; these two are the
    # leaves under it that actually publish.
    - name: "ASG — Licitaciones (Subastas)"
      url: "https://asg.pr.gov/subastas?order_by=-creado"
      parser: asg_cards
      tier: "T1"
      section: "Licitación de la Administración de Servicios Generales"
      item_selector: ".card-media-info"
      title_selectors: [".subasta-card-number", ".subasta-card-method", ".subasta-card-agency"]
      body_selectors: [".subasta-card-purpose", ".subasta-card-agency", ".subasta-card-method"]
      link_selector: "a[href]"
      # Bid cards carry no date, so each entry's page is fetched for its opening
      # date. Sorted newest-first, two pages (~54 bids) covers a routine poll;
      # raise max_pages to backfill the full 64-page index.
      detail_date_label: "Acto de Apertura"
      max_pages: 2

    - name: "ASG — Noticias"
      url: "https://asg.pr.gov/noticias/"
      parser: asg_cards
      tier: "T2"
      section: "Noticia de la Administración de Servicios Generales"
      # The lead story is marked up as article.blog-featured with an <h2>, not
      # article.blog-card with a .blog-card-title. Matching only the latter
      # silently drops whichever story ASG is currently promoting.
      item_selector: "article.blog-card, article.blog-featured"
      title_selectors: [".blog-card-title", ".blog-featured-body h2"]
      date_selector: ".blog-card-meta span:last-of-type"
      body_selectors: ["p"]
      link_selector: "a.blog-link"
      # Dated on the card, so no detail fetch. Two pages is the whole archive.
      max_pages: 2

    - name: "EPA Region 2 — Puerto Rico NPDES Permits"
      url: "https://www.epa.gov/npdes-permits/puerto-rico-npdes-permits"
      parser: html_table
      tier: "T1"
      # Columns: Location | Facility or Permit Name | Permit Number |
      # Permit Type | Permit Status | Public Notice Date |
      # Public Notice Comment Period End Date | Permit Effective/Expiration Date
      title_columns: ["Facility or Permit Name", "Permit Number", "Permit Status"]
      date_column: "Public Notice Date"

    - name: "USACE Jacksonville — Regulatory Public Notices"
      url: "https://www.saj.usace.army.mil/DesktopModules/ArticleCS/RSS.ashx?ContentType=4&Site=435&isdashboardselected=0&max=20"
      parser: rss_detail
      # DISABLED: saj.usace.army.mil sits behind an Akamai edge that refuses
      # programmatic clients — httpx/curl get "403 Access Denied" (even for
      # robots.txt) and headless Chromium gets ERR_CONNECTION_RESET. Only the
      # RSS endpoint answers, and its items are opaque permit-ID stubs
      # ("SAJ-2023-00283(AJC)") with no body or location, so they cannot be
      # PR-filtered or classified. The rss_detail connector is implemented and
      # tested; flip this to true from a network the edge accepts — no code
      # change required.
      enabled: false
      tier: "T1"
      match_any: ["puerto rico", "antilles", "vieques", "culebra"]
