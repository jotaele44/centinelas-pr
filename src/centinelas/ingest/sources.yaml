  # ── Puerto Rico Permit Ecosystem — DRNA ───────────────
  # DRNA (Departamento de Recursos Naturales y Ambientales, incl. the former
  # JCA/Junta de Calidad Ambiental) is the territorial coastal/environmental
  # permitting authority. Its site is WordPress, so every content category
  # exposes a valid `/cat/<slug>/feed/` RSS endpoint (verified 200 + <item>s).
  # These are the pre-officialization permit signals — boundary certifications,
  # environmental-impact determinations, public hearings, notices, reviews —
  # that anchor to aguayluz-pr (ENVIRONMENTAL) and, for RFP/subasta items,
  # moneysweep-pr (FINANCIAL) via classify/rules.py. Add more DRNA category
  # feeds here as new permit beats appear (enumerate via /wp-json/wp/v2/categories).

