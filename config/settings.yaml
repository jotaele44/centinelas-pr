centinelas:
  # Local is the credential-free authoritative classifier. Anthropic is an
  # explicit optional adapter selected with CENTINELAS_CLASSIFIER_BACKEND.
  classifier_backend: "${CENTINELAS_CLASSIFIER_BACKEND:-local}"
  anthropic_api_key: "${ANTHROPIC_API_KEY:-}"

  # Canonical cross-repository authority. Hosted bridges may mirror exact bytes
  # only after a local envelope exists.
  exchange_root: "${CENTINELAS_EXCHANGE_ROOT:-.centinelas/exchange}"

  # Logging
  log_level: "INFO"

  # Classification
  classifier:
    local_engine: "deterministic_keyword_rules"
    hosted_adapter: "anthropic"
    hosted_model: "claude-haiku-4-5-20251001"
    keyword_confidence_threshold: 0.85
    route_confidence_threshold: 0.55

  # Ingest
  ingest:
    sources_file: "src/centinelas/ingest/sources.yaml"
    default_evidence_tier: "T2"

  # Routing
  routing:
    dry_run: false
    always_stage_to_hub: true
    hosted_mirror_default: false
